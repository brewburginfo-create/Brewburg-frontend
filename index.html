<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({ appId: "e7de4ee5-1613-4e9f-badc-8e5fb5b7c212" });
  });
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>☕ Brewburg</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { background: #080808; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; height: 100vh; overflow: hidden; }
  #app { height: 100vh; display: flex; flex-direction: column; max-width: 480px; margin: 0 auto; }
  .header { padding: 16px 20px 10px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
  .logo { font-size: 20px; font-weight: 900; letter-spacing: -0.5px; }
  .tagline { font-size: 9px; color: #444; letter-spacing: 2px; margin-top: 2px; }
  .live { display: flex; align-items: center; gap: 6px; background: #1a1a1a; padding: 5px 12px; border-radius: 20px; }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #00E5A0; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .live-text { font-size: 10px; color: #00E5A0; font-weight: 700; letter-spacing: 1px; }
  .tabs { display: flex; padding: 0 20px; margin-bottom: 6px; border-bottom: 1px solid #1a1a1a; flex-shrink: 0; }
  .tab { margin-right: 20px; padding-bottom: 8px; font-size: 13px; font-weight: 700; color: #444; cursor: pointer; border-bottom: 2px solid transparent; }
  .tab.active { color: #fff; border-bottom-color: #00E5A0; }
  .top-bar { display: flex; align-items: center; gap: 8px; padding: 0 16px 10px; flex-shrink: 0; }
  .categories { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; flex: 1; }
  .categories::-webkit-scrollbar { display: none; }
  .cat { padding: 5px 13px; border-radius: 20px; background: #111; border: 1px solid #222; font-size: 12px; font-weight: 600; color: #666; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
  .refresh-btn { font-size: 11px; color: #444; border: 1px solid #222; background: #111; padding: 5px 10px; border-radius: 20px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
  .pull-indicator { text-align: center; color: #00E5A0; font-size: 13px; font-weight: 600; letter-spacing: 1px; height: 0; overflow: hidden; transition: height 0.15s ease, opacity 0.15s ease; opacity: 0; flex-shrink: 0; }
  .feed { flex: 1; overflow-y: scroll; scroll-snap-type: y mandatory; padding: 0 12px; scrollbar-width: none; overflow-x: hidden; }
  .feed::-webkit-scrollbar { display: none; }
  .card-wrapper { scroll-snap-align: start; position: relative; margin-bottom: 14px; min-height: calc(100vh - 220px); touch-action: pan-y; }
  .card { background: #111; border-radius: 20px; padding: 20px; height: 100%; display: flex; flex-direction: column; border-left: 4px solid #444; will-change: transform; transition: none; position: relative; overflow: hidden; }
  .card.animating { transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
  .card.read { opacity: 0.5; }
  .swipe-reveal { position: absolute; right: 0; top: 0; bottom: 0; width: 70px; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; border-radius: 0 20px 20px 0; background: linear-gradient(to left, rgba(0,229,160,0.15), transparent); }
  .swipe-arrow { font-size: 26px; color: #00E5A0; transform: translateX(10px); transition: transform 0.1s ease; }
  .card-image { width: 100%; height: 160px; object-fit: cover; border-radius: 12px; margin-bottom: 14px; }
  .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .badge { padding: 4px 10px; border-radius: 8px; font-size: 9px; font-weight: 800; letter-spacing: 1px; }
  .source { font-size: 11px; color: #444; }
  .title { font-size: 18px; font-weight: 800; line-height: 1.3; margin-bottom: 14px; }
  .brief { font-size: 14px; line-height: 1.7; color: #aaa; flex: 1; }
  .brief b { color: #fff; font-weight: 800; }
  .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding-top: 12px; border-top: 1px solid #1e1e1e; }
  .hint { font-size: 11px; color: #333; }
  .btn { background: none; border: none; font-size: 20px; color: #555; cursor: pointer; padding: 4px; }
  .btn.saved { color: #FFD700; }
  .loader { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: #444; }
  .spinner { width: 32px; height: 32px; border: 3px solid #222; border-top-color: #00E5A0; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { flex: 1; display: flex; align-items: center; justify-content: center; color: #444; font-size: 14px; text-align: center; padding: 40px; line-height: 1.6; }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div>
      <div class="logo">☕ brewburg</div>
      <div class="tagline">BUSINESS · 60 WORDS · UNFILTERED</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
  <div class="live"><div class="live-dot"></div><div class="live-text">LIVE</div></div>
  <div id="notif-btn" onclick="enableNotifs()" style="background:#1a1a1a;border:1px solid #222;padding:5px 10px;border-radius:20px;font-size:10px;color:#666;cursor:pointer;">🔔 Notify me</div>
</div>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('feed')">Feed</div>
    <div class="tab" onclick="switchTab('saved')">Saved ★</div>
  </div>
  <div class="top-bar">
    <div class="categories" id="cats"></div>
    <div class="refresh-btn" onclick="forceRefresh()">↻</div>
  </div>
  <div class="pull-indicator" id="pullIndicator">↓ Pull to refresh</div>
  <div class="feed" id="feed"></div>
</div>

<script>
const CAT_COLORS = { Funding:'#00E5A0', IPO:'#8B7FFF', 'M&A':'#FF6B6B', Markets:'#FFB347', 'Market Gap':'#00D4FF', Geopolitics:'#FF8C42' };
const CATS = ['All','Funding','IPO','M&A','Markets','Market Gap','Geopolitics'];
const API = 'https://brewburg-backend-1.onrender.com';
let stories = [], saved = JSON.parse(localStorage.getItem('brewburg_saved') || '{}');
let readIds = JSON.parse(localStorage.getItem('brewburg_read') || '[]');
let activeTab = 'feed', activeCat = 'All';

function timeAgo(dateStr) {
  const diff = Math.floor((Date.now() - new Date(dateStr)) / 1000);
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  return new Date(dateStr).toLocaleDateString('en-IN', {day:'numeric', month:'short'});
}

async function loadStories() {
  document.getElementById('feed').innerHTML = '<div class="loader"><div class="spinner"></div><p>Brewing your news...</p></div>';
  try {
    const url = activeCat === 'All' ? API + '/api/stories?limit=40&order=published_at' : API + '/api/stories?category=' + activeCat + '&limit=40&order=published_at';
    const res = await fetch(url);
    const data = await res.json();
    stories = data.stories || [];
    sessionStorage.setItem('stories_cache', JSON.stringify(stories));
    render();
  } catch(e) {
    document.getElementById('feed').innerHTML = '<div class="empty">Could not connect.<br>Tap ↻ to try again.</div>';
  }
}

function forceRefresh() {
  sessionStorage.removeItem('stories_cache');
  loadStories();
}

function render() {
  const unread = stories.filter(s => !readIds.includes(s.id));
  const read = stories.filter(s => readIds.includes(s.id));
  const ordered = activeTab === 'saved' ? stories.filter(s => saved[s.id]) : [...unread, ...read];
  if (!ordered.length) { document.getElementById('feed').innerHTML = '<div class="empty">No stories here yet.</div>'; return; }
  document.getElementById('feed').innerHTML = ordered.map(s => {
    const color = CAT_COLORS[s.category] || '#666';
    const brief = (s.brief || '').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
    const img = s.image_url ? '<img class="card-image" src="' + s.image_url + '" onerror="this.style.display=\'none\'">' : '';
    const time = s.published_at ? timeAgo(s.published_at) : '';
    const isRead = readIds.includes(s.id);
    return '<div class="card-wrapper"><div class="card' + (isRead ? ' read' : '') + '" style="border-left-color:' + color + '" data-url="' + s.url + '" data-id="' + s.id + '">' +
      img +
      '<div class="card-top"><span class="badge" style="background:' + color + '22;color:' + color + '">' + (s.category||'').toUpperCase() + '</span><span class="source">' + (s.source||'') + ' · ' + time + '</span></div>' +
      '<div class="title">' + s.title + '</div>' +
      '<div class="brief">' + brief + '</div>' +
      '<div class="card-footer"><span class="hint">← swipe left for article</span><div class="actions">' +
      '<button class="btn ' + (saved[s.id]?'saved':'') + '" onclick="event.stopPropagation();toggleSave(\'' + s.id + '\')">' + (saved[s.id]?'★':'☆') + '</button>' +
      '</div></div>' +
      '<div class="swipe-reveal" id="hint-' + s.id + '"><div class="swipe-arrow">←</div></div>' +
      '</div></div>';
  }).join('');
  setupSwipe();
}

function openArticle(url) {
  const story = stories.find(s => s.url === url);
  if (!story) return;
  const color = CAT_COLORS[story.category] || '#666';
  const brief = (story.brief || '').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
  const backdrop = document.createElement('div');
  backdrop.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:9998;backdrop-filter:blur(4px);';
  const sheet = document.createElement('div');
  sheet.style.cssText = 'position:fixed;left:0;right:0;bottom:0;background:#141414;z-index:9999;border-radius:28px 28px 0 0;padding:0 20px 48px;transform:translateY(100%);transition:transform 0.4s cubic-bezier(0.25,0.46,0.45,0.94);max-height:88vh;overflow-y:auto;';
  sheet.innerHTML =
    '<div style="width:36px;height:4px;background:#2a2a2a;border-radius:2px;margin:16px auto 20px;"></div>' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">' +
    '<span style="background:' + color + '22;color:' + color + ';font-size:9px;font-weight:800;letter-spacing:1px;padding:4px 10px;border-radius:8px;">' + (story.category||'').toUpperCase() + '</span>' +
    '<span style="color:#444;font-size:11px;">' + (story.source||'') + ' · ' + timeAgo(story.published_at) + '</span></div>' +
    (story.image_url ? '<img src="' + story.image_url + '" style="width:100%;height:180px;object-fit:cover;border-radius:14px;margin-bottom:18px;" onerror="this.style.display=\'none\'">' : '') +
    '<div style="font-size:20px;font-weight:900;line-height:1.3;margin-bottom:14px;color:#fff;">' + story.title + '</div>' +
    '<div style="font-size:14px;line-height:1.8;color:#aaa;margin-bottom:28px;">' + brief + '</div>' +
    '<a href="' + url + '" target="_blank" style="display:block;background:#00E5A0;color:#000;font-size:15px;font-weight:800;text-align:center;padding:16px;border-radius:16px;text-decoration:none;margin-bottom:12px;">Read Full Article →</a>' +
    '<button onclick="closeSheet()" style="display:block;width:100%;background:transparent;border:1px solid #222;color:#666;font-size:14px;font-weight:600;padding:14px;border-radius:16px;cursor:pointer;">← Back to Feed</button>';
  function closeSheet() {
    sheet.style.transform = 'translateY(100%)';
    backdrop.style.opacity = '0';
    setTimeout(() => { sheet.remove(); backdrop.remove(); }, 400);
  }
  backdrop.onclick = closeSheet;
  document.body.appendChild(backdrop);
  document.body.appendChild(sheet);
  requestAnimationFrame(() => { sheet.style.transform = 'translateY(0)'; });
}

function setupSwipe() {
  document.querySelectorAll('.card').forEach(card => {
    let startX = 0, startY = 0, currentX = 0, isHorizontal = null;
    const url = card.dataset.url;
    const id = card.dataset.id;
    const hint = document.getElementById('hint-' + id);
    const arrow = hint ? hint.querySelector('.swipe-arrow') : null;

    card.addEventListener('touchstart', e => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      currentX = 0; isHorizontal = null;
      card.classList.remove('animating');
    }, { passive: true });

    card.addEventListener('touchmove', e => {
      const dx = e.touches[0].clientX - startX;
      const dy = e.touches[0].clientY - startY;
      if (isHorizontal === null) isHorizontal = Math.abs(dx) > Math.abs(dy);
      if (isHorizontal && dx < 0) {
        currentX = dx;
        const clamped = Math.max(currentX, -100);
        card.style.transform = 'translateX(' + clamped + 'px)';
        const progress = Math.min(Math.abs(clamped) / 80, 1);
        if (hint) hint.style.opacity = progress;
        if (arrow) arrow.style.transform = 'translateX(' + (-10 * progress) + 'px)';
      }
    }, { passive: true });

    card.addEventListener('touchend', () => {
      if (hint) hint.style.opacity = 0;
      if (arrow) arrow.style.transform = 'translateX(10px)';
      card.classList.add('animating');
      card.style.transform = 'translateX(0)';
      if (currentX < -60 && url) {
        if (!readIds.includes(id)) {
          readIds.push(id);
          localStorage.setItem('brewburg_read', JSON.stringify(readIds));
          const cardEl = document.querySelector('[data-id="' + id + '"]');
          if (cardEl) cardEl.classList.add('read');
        }
        setTimeout(() => openArticle(url), 300);
      }
      currentX = 0; isHorizontal = null;
    }, { passive: true });
  });
}

function toggleSave(id) {
  saved[id] = !saved[id];
  if (!saved[id]) delete saved[id];
  localStorage.setItem('brewburg_saved', JSON.stringify(saved));
  render();
}

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', (i===0&&tab==='feed')||(i===1&&tab==='saved')));
  render();
}

function setCat(cat) {
  activeCat = cat;
  document.querySelectorAll('.cat').forEach(c => {
    const a = c.dataset.cat === cat;
    c.style.background = a ? (CAT_COLORS[cat]||'#666') : '#111';
    c.style.borderColor = a ? (CAT_COLORS[cat]||'#666') : '#222';
    c.style.color = a ? '#000' : '#666';
  });
  sessionStorage.removeItem('stories_cache');
  loadStories();
}

document.getElementById('cats').innerHTML = CATS.map(c =>
  '<div class="cat" data-cat="' + c + '" onclick="setCat(\'' + c + '\')" style="' + (c==='All'?'background:#666;border-color:#666;color:#000':'') + '">' + c + '</div>'
).join('');

// Pull to refresh
const pullEl = document.getElementById('pullIndicator');
let touchStartY = 0, isRefreshing = false;
document.getElementById('feed').addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; }, { passive: true });
document.getElementById('feed').addEventListener('touchmove', e => {
  if (isRefreshing) return;
  const dist = e.touches[0].clientY - touchStartY;
  if (dist > 0 && document.getElementById('feed').scrollTop === 0) {
    pullEl.style.height = Math.min(dist * 0.45, 40) + 'px';
    pullEl.style.opacity = Math.min(dist / 60, 1);
    pullEl.textContent = dist > 70 ? '↑ Release to refresh' : '↓ Pull to refresh';
  }
}, { passive: true });
document.getElementById('feed').addEventListener('touchend', e => {
  const dist = e.changedTouches[0].clientY - touchStartY;
  if (dist > 70 && document.getElementById('feed').scrollTop === 0 && !isRefreshing) {
    isRefreshing = true;
    pullEl.textContent = '⟳ Refreshing...';
    pullEl.style.height = '40px';
    pullEl.style.opacity = '1';
    sessionStorage.removeItem('stories_cache');
    loadStories().then(() => { pullEl.style.height = '0'; pullEl.style.opacity = '0'; isRefreshing = false; });
  } else {
    pullEl.style.height = '0'; pullEl.style.opacity = '0';
  }
}, { passive: true });

const cached = sessionStorage.getItem('stories_cache');
if (cached) { stories = JSON.parse(cached); render(); } else { loadStories(); }

setInterval(() => { sessionStorage.removeItem('stories_cache'); loadStories(); }, 30 * 60 * 1000);
</script>
</body>
</html>
